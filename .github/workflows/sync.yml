name: Sync Postman Workspace

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Export Postman workspace
        env:
          POSTMAN_API_KEY: ${ { secrets.POSTMAN_API_KEY } }
        run: |
          cd scripts
          node export.js
      - name: Commit exported files
        run: |
          git config user.name "GCAT Sync Bot"
          git config user.email "sync@sfemeraldtrust.com"
          git add collections/ environments/
          git diff --staged --quiet || git commit -m "Auto-sync: Postman workspace export $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
